<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bookmark Form</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow mt-5">

                <div class="card-body p-4">

                    <!-- Page title -->
                    <h2 class="text-center mb-4"
                        th:text="${bookmark.id == null}
                            ? 'Add Bookmark'
                            : 'Edit Bookmark'">
                    </h2>

                    <!-- Error message -->
                    <div th:if="${error}"
                         th:text="${error}"
                         class="alert alert-danger">
                    </div>

                    <form th:action="${bookmark.id == null}
                            ? @{/bookmarks/add}
                            : @{/bookmarks/edit/{id}(id=${bookmark.id})}"
                          method="post">

                        <!-- Title -->
                        <div class="mb-3">

                            <label for="title"
                                   class="form-label">
                                Title
                            </label>

                            <input type="text"
                                   id="title"
                                   name="title"
                                   th:value="${bookmark.title}"
                                   class="form-control"
                                   placeholder="Enter bookmark title"
                                   required>

                        </div>

                        <!-- URL -->
                        <div class="mb-3">

                            <label for="url"
                                   class="form-label">
                                URL
                            </label>

                            <input type="url"
                                   id="url"
                                   name="url"
                                   th:value="${bookmark.url}"
                                   class="form-control"
                                   placeholder="https://example.com"
                                   required>

                        </div>

                        <!-- Save button -->
                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary">
                                Save Bookmark
                            </button>

                        </div>

                    </form>

                    <!-- Back button -->
                    <div class="text-center mt-3">

                        <a th:href="@{/bookmarks}"
                           class="btn btn-outline-secondary">
                            Back to Bookmarks
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
